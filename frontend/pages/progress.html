<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress — EduTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages/progress.css">
</head>
<body data-page="progress">

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span> EduTrack</div>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="student-dashboard.html">🏠 Dashboard</a>
      <a class="sidebar-link" href="courses.html">📚 Courses</a>
      <a class="sidebar-link" href="my-enrollments.html">🎓 My Enrollments</a>
      <a class="sidebar-link active" href="progress.html">📈 Progress</a>
      <a class="sidebar-link" href="notifications.html">🔔 Notifications</a>
    </nav>
    <div class="sidebar-footer"><a href="#" onclick="AuthService.logout(); return false;" style="color:var(--color-mist)">↩ Sign out</a></div>
  </aside>

  <div class="main-panel">
    <header class="topbar">
      <h3 style="margin:0">Progress</h3>
      <div class="topbar-actions"><a class="notif-dot" href="notifications.html" style="font-size:20px">🔔</a><div class="avatar" id="topbar-avatar">S</div></div>
    </header>

    <main class="main-content">
      <div class="progress-overview">
        <div class="card ring-panel">
          <div class="progress-ring" id="progress-ring" style="--pct:0">
            <span id="progress-ring-value">0%</span>
          </div>
          <h4 style="margin:0">Overall completion</h4>
          <p class="text-sm" style="margin:0">Across all enrolled courses</p>
        </div>

        <div class="card">
          <h4>Milestones</h4>
          <div class="milestone-list" id="milestone-list"></div>
        </div>
      </div>

      <div class="card">
        <h4>Progress by course</h4>
        <div id="course-progress-rows"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="../js/utils/auth.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/api/axiosClient.js"></script>
<script src="../js/api/progressService.js"></script>
<script src="../js/socket/socketClient.js"></script>
<script src="../js/pages/progressTracker.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const user = AuthUtil.getUser();
    if (user) Helpers.qs('#topbar-avatar').textContent = Helpers.initials(user.name);
    SocketClient.init();
  });
</script>
</body>
</html>
