<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — EduTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div class="brand"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--color-steel);display:inline-block"></span> EduTrack</div>
    <div class="quote">
      <h2>"Progress you can actually see."</h2>
      <p>EduTrack keeps every course, deadline, and milestone in one calm, uncluttered view.</p>
    </div>
    <svg class="auth-wave-svg" viewBox="0 0 1440 200" xmlns="http://www.w3.org/2000/svg">
      <path fill="#5289AD" d="M0,100 C 240,180 480,20 720,100 C 960,180 1200,20 1440,100 L1440,200 L0,200 Z"></path>
    </svg>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <span class="eyebrow">Welcome back</span>
      <h1>Sign in</h1>
      <p>New to EduTrack? <a href="register.html">Create an account</a></p>

      <form id="login-form" style="margin-top:24px;">
        <div class="field">
          <label for="email">Email address</label>
          <div class="input-group">
            <span class="icon">✉</span>
            <input class="input-field" type="email" id="email" placeholder="you@example.com" required>
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-group">
            <span class="icon">🔒</span>
            <input class="input-field" type="password" id="password" placeholder="••••••••" required>
          </div>
        </div>
        <div class="remember-row">
          <label class="checkbox-row"><input type="checkbox" id="remember"> Remember me</label>
          <a href="#" class="text-sm">Forgot password?</a>
        </div>
        <button type="submit" id="login-submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <div class="switch-link">By signing in, you agree to EduTrack's Terms &amp; Privacy Policy.</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>
<script src="../js/utils/auth.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/api/axiosClient.js"></script>
<script src="../js/api/authService.js"></script>
<script src="../js/pages/login.js"></script>
</body>
</html>
