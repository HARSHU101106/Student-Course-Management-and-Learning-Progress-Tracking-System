name: CI

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project structure
        run: test -f README.md && test -f frontend-static/index.html && test -f client/package.json && test -f server/package.json && test -f ai-service/requirements.txt
