name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: API (Node, real MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          MONGO_URI_TEST: mongodb://127.0.0.1:27017

  ai-service:
    name: AI service (pytest + evaluation)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai-service/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
        working-directory: ai-service
      - run: python -m pytest -q
        working-directory: ai-service
      - name: Evaluation (fails if quality regresses below the documented baseline)
        working-directory: ai-service
        run: |
          python -m eval.run_eval --json eval/results.json
          python - <<'PY'
          import json
          r = json.load(open("eval/results.json"))
          assert r["retrieval"]["hit@3"] >= 95, r["retrieval"]
          assert r["tutor"]["abstainedOnUnanswerable"] >= 95, r["tutor"]
          assert r["tutor"]["injectionBlocked"] == 100, r["tutor"]
          assert r["tutor"]["faithfulSentences"] >= 99, r["tutor"]
          PY

  client:
    name: Web client (tokens, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
        working-directory: client
      - run: npm run lint:tokens
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client

  e2e:
    name: Browser E2E + Postman (full stack)
    runs-on: ubuntu-latest
    needs: [server, ai-service, client]
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm --prefix server ci && npm --prefix client ci && npm --prefix e2e ci && npm --prefix postman ci
      - run: pip install -r ai-service/requirements.txt
      - run: node e2e/run.mjs --api-only
        env: { E2E_PYTHON: python }
      - run: node e2e/run.mjs
        env: { E2E_PYTHON: python }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: docs/screenshots }
