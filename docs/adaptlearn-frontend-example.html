<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdaptLearn: learn from NPTEL lectures, guided by what you know</title>
<meta name="description" content="AdaptLearn turns free NPTEL courses into a learning path that adapts to your quiz results and watch time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F1F7F8; --surface:#FFFFFF; --surface-2:#E4EFF1; --ink:#10283A; --muted:#48606F; --line:#CADDE2;
  --primary:#0F6F7C; --on-primary:#FFFFFF; --primary-soft:#D3EEF1; --primary-text:#0B5C67;
  --sun:#FFC53D; --on-sun:#10283A; --sun-soft:#FFF0C7; --sun-text:#6B4A00;
  --coral:#F0705F; --coral-soft:#FFE0DB; --coral-text:#A73222;
  --mint:#4FC79A; --mint-soft:#D5F4E7; --mint-text:#136B45;
  --shadow:0 16px 32px -20px rgba(16,40,58,.5),0 2px 6px -2px rgba(16,40,58,.12);
  --edge:rgba(6,32,42,.3);
  --board:#0E3B47;
  --font-display:'Nunito','Trebuchet MS',ui-rounded,system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1A24; --surface:#122736; --surface-2:#19364A; --ink:#E9F4F6; --muted:#A3BBC6; --line:#25475A;
    --primary:#53C7D6; --on-primary:#062029; --primary-soft:#164556; --primary-text:#7FDCE8;
    --sun-soft:#3B3216; --sun-text:#FFD36E;
    --coral:#FF8A79; --coral-soft:#4A2622; --coral-text:#FFA093;
    --mint:#5BD6A5; --mint-soft:#15402F; --mint-text:#7BE3B7;
    --shadow:0 16px 32px -20px rgba(0,0,0,.8),0 2px 6px -2px rgba(0,0,0,.4);
    --edge:rgba(0,0,0,.45); --board:#0A2E38;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1A24; --surface:#122736; --surface-2:#19364A; --ink:#E9F4F6; --muted:#A3BBC6; --line:#25475A;
  --primary:#53C7D6; --on-primary:#062029; --primary-soft:#164556; --primary-text:#7FDCE8;
  --sun-soft:#3B3216; --sun-text:#FFD36E;
  --coral:#FF8A79; --coral-soft:#4A2622; --coral-text:#FFA093;
  --mint:#5BD6A5; --mint-soft:#15402F; --mint-text:#7BE3B7;
  --shadow:0 16px 32px -20px rgba(0,0,0,.8),0 2px 6px -2px rgba(0,0,0,.4);
  --edge:rgba(0,0,0,.45); --board:#0A2E38;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;line-height:1.12;letter-spacing:-.01em;margin:0 0 .5em}
h1{font-size:clamp(2.2rem,5.4vw,3.9rem);font-weight:900}
h2{font-size:clamp(1.55rem,3vw,2.1rem)}
h3{font-size:1.15rem}
p{margin:0 0 1rem}
a{color:var(--primary-text)}
img,svg{max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.container{width:min(1180px,100% - 2rem);margin-inline:auto}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
#main:focus{outline:none}
.skip{position:absolute;left:1rem;top:-4rem;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;z-index:100;text-decoration:none;transition:top .15s}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + .5rem)}

/* header */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:.75rem;min-height:64px}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:900;font-size:1.3rem}
.brand-mark{display:grid;place-items:center;width:38px;height:38px}
.nav{display:flex;gap:.25rem;margin-left:1rem}
.nav a,.nav button.navlink{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;padding:0 .9rem;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:700;background:none;border:0}
.nav a:hover,.nav button.navlink:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary-text)}
.tools{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.menu-btn{display:none}
.only-sm{display:none}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:none;border:1px solid transparent;color:var(--ink);transition:background .15s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .ic{width:1.3em;height:1.3em}
.dot{position:absolute;top:2px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--coral);color:#10283A;font-size:.72rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.dot[hidden]{display:none}
.avatar{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--sun);color:var(--on-sun);font-weight:800;font-family:var(--font-display)}
.bell-panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);right:.75rem;width:min(360px,calc(100vw - 1.5rem));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:1rem;z-index:60}
.bell-panel[hidden]{display:none}
.bell-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.bell-panel ul{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.bell-panel li{padding:.65rem .75rem;border-radius:12px;background:var(--surface-2);font-size:.92rem}
.bell-panel li.unread{background:var(--primary-soft);color:var(--primary-text)}
.bell-panel li small{display:block;color:var(--muted);font-size:.78rem}
.bell-panel li.unread small{color:var(--primary-text)}
.live{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:700;color:var(--mint-text);background:var(--mint-soft);padding:.15rem .6rem;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mint-text);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:0 1.25rem;border-radius:14px;border:0;font-weight:700;text-decoration:none;transition:transform .12s,box-shadow .12s,background .15s;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--edge)}
.btn.sun{background:var(--sun);color:var(--on-sun);box-shadow:0 4px 0 var(--edge)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.small{min-height:40px;padding:0 1rem;font-size:.92rem}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.link{background:none;border:0;color:var(--primary-text);font-weight:700;text-decoration:underline;padding:.4rem 0;min-height:44px}

/* layout blocks */
#view{overflow-x:clip;min-height:70vh;padding-bottom:3rem}
.section{padding:3rem 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:1.25rem;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--muted)}
.lede{font-size:1.15rem;max-width:34rem;color:var(--muted)}
.fine{font-size:.85rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.between{justify-content:space-between}
.page-head{padding:2rem 0 1rem}
.page-head p{color:var(--muted);margin:0}

/* hero */
.hero{display:grid;gap:2rem;grid-template-columns:minmax(0,1fr);padding:2.25rem 0 1rem;align-items:center}
@media(min-width:960px){.hero{grid-template-columns:minmax(0,5fr) minmax(0,7fr);padding:3.25rem 0 1.5rem;gap:2.5rem}}
.hero h1 span{display:block}
.hero h1 span:nth-child(1){animation:rise .7s cubic-bezier(.2,.8,.2,1) both .05s}
.hero h1 span:nth-child(2){animation:rise .7s cubic-bezier(.2,.8,.2,1) both .18s}
.hero .lede,.hero .cta-row,.hero .fine{animation:rise .7s cubic-bezier(.2,.8,.2,1) both .3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cta-row{display:flex;flex-wrap:wrap;gap:.9rem;margin:1.6rem 0 1rem}
.stage{position:relative;height:clamp(320px,56vw,560px);border-radius:32px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}
.stage.sm{height:clamp(300px,42vw,420px)}
.stage canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.stage svg.fallback{position:absolute;inset:0;width:100%;height:100%}
.gl-tip{position:absolute;z-index:2;pointer-events:none;background:var(--ink);color:var(--bg);padding:.5rem .75rem;border-radius:12px;font-size:.85rem;line-height:1.35;max-width:220px;transform:translate(-50%,-100%);box-shadow:var(--shadow)}
.gl-tip[hidden]{display:none}
.gl-tip strong{display:block}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;margin:.9rem 0 0;padding:0;list-style:none;font-size:.9rem;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:.4rem}
.hint-line{font-size:.85rem;color:var(--muted);margin:.4rem 0 0}

/* steps */
.steps{display:grid;gap:1.75rem;counter-reset:s;padding:0;margin:1.5rem 0 0;list-style:none}
@media(min-width:800px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.steps li{position:relative;padding-top:3.6rem;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;top:0;left:0;width:46px;height:46px;border-radius:50%;background:var(--sun);color:var(--on-sun);font:900 1.3rem var(--font-display);display:grid;place-items:center;box-shadow:0 4px 0 var(--edge)}
@media(min-width:800px){.steps li:not(:last-child)::after{content:"";position:absolute;top:22px;left:64px;right:-1rem;border-top:3px dotted var(--line)}}
.steps h3{margin-bottom:.3rem}
.steps p{color:var(--muted);margin:0}
.inside{display:grid;gap:2rem;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:900px){.inside{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}}
.feature-list{list-style:none;margin:1.25rem 0 0;padding:0;display:grid;gap:1.25rem}
.feature-list li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:.9rem}
.feature-list .fi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-text)}
.feature-list li:nth-child(2) .fi{background:var(--sun-soft);color:var(--sun-text)}
.feature-list li:nth-child(3) .fi{background:var(--mint-soft);color:var(--mint-text)}
.feature-list li:nth-child(4) .fi{background:var(--coral-soft);color:var(--coral-text)}
.feature-list h3{margin:0 0 .15rem}
.feature-list p{margin:0;color:var(--muted)}
.cta-band{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between;background:var(--primary);color:var(--on-primary);border-radius:32px;padding:2rem}
.cta-band h2{margin:0}
.cta-band p{margin:.25rem 0 0;opacity:.92}
.cta-band .btn.sun{flex:none}

/* forms */
.auth{display:grid;place-items:start center;padding:2.5rem 0}
.auth .card{width:min(460px,100%);padding:1.75rem;border-radius:28px}
.auth-top{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.field{margin-bottom:1rem}
.field label{display:block;font-weight:700;margin-bottom:.35rem}
.field input,.field select{width:100%;min-height:46px;padding:.55rem .85rem;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 30%,transparent)}
.field.invalid input,.field.invalid select{border-color:var(--coral)}
.field.valid input,.field.valid select{border-color:var(--mint)}
.hint{font-size:.85rem;color:var(--muted);margin:.3rem 0 0}
.msg{display:flex;gap:.4rem;align-items:flex-start;font-size:.88rem;margin:.3rem 0 0;min-height:0}
.msg:empty{display:none}
.field.invalid .msg{color:var(--coral-text);font-weight:700}
.field.valid .msg{color:var(--mint-text)}
.pw{position:relative}
.pw input{padding-right:5rem}
.pw .reveal{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);min-height:38px;padding:0 .7rem;border-radius:9px;border:0;background:var(--surface-2);font-weight:700;font-size:.85rem}
.form-note{font-size:.88rem;color:var(--muted);background:var(--surface-2);padding:.7rem .9rem;border-radius:12px;margin:1rem 0 0}

/* progress + badges */
.bar-track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-track>i{display:block;height:100%;width:100%;border-radius:inherit;background:var(--primary);transform:scaleX(var(--v,0));transform-origin:left;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.bar-track.mint>i{background:var(--mint)}
.bar-track.coral>i{background:var(--coral)}
.bar-track.sun>i{background:var(--sun)}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .65rem;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap}
.b-revisit{background:var(--coral-soft);color:var(--coral-text)}
.b-practise{background:var(--sun-soft);color:var(--sun-text)}
.b-advance{background:var(--primary-soft);color:var(--primary-text)}
.b-done,.b-strong{background:var(--mint-soft);color:var(--mint-text)}
.b-later{background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.35rem;min-height:36px;padding:0 .8rem;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.88rem}
button.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip.cite{background:var(--primary-soft);border-color:transparent;color:var(--primary-text);min-height:32px;font-size:.8rem}

/* dashboard */
.dash{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.dash{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.stack{display:grid;gap:1.25rem;align-content:start;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin:0}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.9rem 1rem}
.stat dt{color:var(--muted);font-size:.85rem;order:2}
.stat dd{margin:0;font:900 1.9rem/1.1 var(--font-display)}
.stat{display:flex;flex-direction:column}
.resume{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.1rem;align-items:center}
.resume h2{margin:0 0 .2rem;font-size:1.4rem}
.ring text{font:800 1.1rem var(--font-display);fill:var(--ink)}
.course-line{display:grid;gap:.35rem;padding:.9rem 0;border-top:1px solid var(--line)}
.course-line:first-of-type{border-top:0}
.plan-mini{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.plan-mini li{display:grid;gap:.25rem;padding:.75rem .9rem;background:var(--surface-2);border-radius:14px}
.xp{display:flex;align-items:center;gap:.9rem}
.flame{width:46px;height:46px;border-radius:14px;background:var(--sun-soft);color:var(--sun-text);display:grid;place-items:center}

/* courses */
.filters{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:1rem 0 1.5rem}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;min-height:46px;padding:.5rem .9rem .5rem 2.6rem;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.search .ic{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.grid{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.course{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s cubic-bezier(.2,.8,.2,1);will-change:transform}
.course .cover{height:112px;display:grid;place-items:center;background:var(--c,var(--primary-soft));color:var(--t,var(--primary-text))}
.course .cover .ic{width:2.6rem;height:2.6rem}
.course .body{padding:1rem 1.15rem 1.2rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.course h3{margin:0}
.course .meta{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.85rem;color:var(--muted)}
.course .meta span{display:inline-flex;align-items:center;gap:.3rem}
.course .push{margin-top:auto;padding-top:.6rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty svg{margin:0 auto .5rem;display:block}

/* lesson */
.lesson{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr);padding-top:1.5rem}
@media(min-width:1040px){.lesson{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.player{border-radius:26px;overflow:hidden;background:var(--board);color:#fff;box-shadow:var(--shadow)}
.screen{aspect-ratio:16/9;display:block;width:100%;background:var(--board)}
.screen svg{display:block;width:100%;height:100%}
.controls{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;background:rgba(0,0,0,.28)}
.controls .time{font-variant-numeric:tabular-nums;font-size:.85rem;min-width:3.2ch}
.controls input[type=range]{flex:1;min-width:0;accent-color:#FFC53D;height:44px;margin:0}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--sun);color:#10283A;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .12s}
.round:active{transform:translateY(2px)}
.speed{min-width:52px;min-height:40px;border-radius:10px;border:1.5px solid rgba(255,255,255,.4);background:none;color:#fff;font-weight:700}
.save-note{font-size:.85rem;color:var(--muted);margin:.6rem .2rem 0;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.topics{display:flex;flex-wrap:wrap;gap:.5rem;margin:.75rem 0 0}
.tabs{display:flex;gap:.3rem;background:var(--surface-2);padding:.3rem;border-radius:16px;margin-bottom:1rem}
.tabs button{flex:1;min-height:42px;border-radius:12px;border:0;background:none;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px -2px rgba(16,40,58,.3)}
.log{display:flex;flex-direction:column;gap:.7rem;height:340px;overflow:auto;padding:.25rem .1rem;scroll-behavior:smooth}
.bubble{max-width:92%;padding:.65rem .9rem;border-radius:18px;font-size:.95rem;overflow-wrap:anywhere}
.bubble.bot{background:var(--surface-2);border-bottom-left-radius:6px;align-self:flex-start}
.bubble.me{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px;align-self:flex-end}
.bubble.peer{background:var(--mint-soft);color:var(--ink);border-bottom-left-radius:6px;align-self:flex-start}
.bubble .who{display:block;font-size:.75rem;font-weight:700;color:var(--mint-text);margin-bottom:.1rem}
.bubble .cites{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.typing{display:inline-flex;gap:4px;align-items:center;height:1.2em}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-5px)}}
.suggest{display:flex;flex-wrap:wrap;gap:.4rem;margin:.75rem 0}
.composer{display:flex;gap:.5rem}
.composer input{flex:1;min-width:0;min-height:46px;padding:.5rem .85rem;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.composer input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 30%,transparent)}
.ask-at{font-size:.82rem;color:var(--muted);margin:.4rem 0 0}
.lesson-list{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.lesson-list a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.6rem .7rem;border-radius:12px;text-decoration:none;color:var(--ink)}
.lesson-list a:hover{background:var(--surface-2)}
.lesson-list a[aria-current="page"]{background:var(--primary-soft)}
.lesson-list small{color:var(--muted)}
.flip{perspective:1100px}
.flip-inner{display:grid;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:1.25rem;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.opts{display:grid;gap:.5rem;margin:.9rem 0}
.opt{display:flex;gap:.7rem;align-items:center;min-height:46px;padding:.4rem .9rem;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary-text)}
.opt:has(input:focus-visible){outline:3px solid var(--primary);outline-offset:2px}
.opt input{accent-color:var(--primary);width:18px;height:18px}
.verdict{display:flex;align-items:center;gap:.5rem;font:800 1.2rem var(--font-display)}
.verdict.ok{color:var(--mint-text)}.verdict.no{color:var(--coral-text)}

/* plan */
.plan-grid{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.plan-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.plan-list{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.plan-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .9rem;padding:.9rem 1rem;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);text-align:left;width:100%;transition:border-color .15s,background .15s}
button.plan-item:hover{background:var(--surface-2)}
.plan-item.hl{border-color:var(--primary);background:var(--primary-soft)}
.plan-item.later{opacity:.75;border-style:dashed}
.plan-item .shape{grid-row:1/3;align-self:center}
.plan-item strong{display:flex;flex-wrap:wrap;gap:.4rem .6rem;align-items:center}
.plan-item p{margin:0;color:var(--muted);font-size:.92rem}
.slider{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
.slider input{flex:1 1 200px;accent-color:var(--primary);height:44px;margin:0}
.mastery-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;margin-bottom:.9rem}
.mastery-row .bar-track{grid-column:1/-1}
.mastery-row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}

/* tables + admin */
.table-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
th{font-size:.85rem;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
.admin-grid{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.admin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.import-steps{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.5rem}
.import-steps li{display:flex;gap:.6rem;align-items:center;color:var(--muted)}
.import-steps li.done{color:var(--mint-text)}
.import-steps li.run{color:var(--ink);font-weight:700}
.import-steps .ic{width:1.2em;height:1.2em}
.chart text{fill:var(--muted);font:600 11px var(--font-body)}
.chart .val{fill:var(--ink);font-weight:800}
.chart rect{fill:var(--primary)}

/* footer + toast */
.foot{border-top:1px solid var(--line);padding:1.5rem 0 2rem;color:var(--muted);font-size:.9rem}
.toasts{position:fixed;left:0;right:0;bottom:0;padding:0 1rem calc(1rem + env(safe-area-inset-bottom,0px));display:grid;gap:.5rem;justify-items:center;pointer-events:none;z-index:80}
.toast{pointer-events:auto;display:flex;gap:.6rem;align-items:center;background:var(--ink);color:var(--bg);padding:.75rem 1rem;border-radius:14px;box-shadow:var(--shadow);max-width:min(440px,100%);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.toast .ic{color:var(--sun);flex:none}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}

@media(max-width:820px){
  .menu-btn{display:inline-grid}
  .nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:.75rem;right:.75rem;margin:0;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:.6rem;box-shadow:var(--shadow);display:none;z-index:70}
  .nav.open{display:flex}
  .only-sm{display:flex;flex-direction:column;gap:.25rem;border-top:1px solid var(--line);margin-top:.4rem;padding-top:.4rem}
  .hide-sm{display:none!important}
  .resume{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:420px){#tEnd{display:none}}
@media(max-width:359px){.brand-text{display:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- planner (deterministic, as in the project plan) ---------- */
const band=m=>{const p=pct(m);return p<60?0:p<80?1:2};
const masteryLabel=m=>[['Weak','b-revisit'],['Close','b-practise'],['Strong','b-strong']][band(m)];
function buildPlan(){
  const items=[];
  LESSONS.forEach(l=>{
    const m=S.mastery[l.topic],w=S.watched[l.id]||0;
    if(w===0){
      items.push({action:'advance',order:3,title:`Lecture ${l.n}: ${l.title}`,course:'Database Management Systems',minutes:Math.round(l.dur/60)+40,lesson:l.id,
        reason:`Ready for the next lecture. Watch it, then take the quiz to set your ${l.topic} mastery.`});
    }else if(band(m)===0){
      const r=l.seg?`${fmt(l.seg[0])} to ${fmt(l.seg[1])}`:'the key section';
      items.push({action:'revisit',order:1,m,title:`${l.topic} (Lecture ${l.n})`,course:'Database Management Systems',minutes:45,lesson:l.id,
        reason:`You scored ${pct(m)}% on ${l.topic}. Rewatch ${r} of Lecture ${l.n}, then retake the quiz.`});
    }else if(band(m)===1){
      items.push({action:'practise',order:2,m,title:`${l.topic} practice`,course:'Database Management Systems',minutes:30,lesson:l.id,
        reason:`${l.topic} is close at ${pct(m)}%. Answer 10 practice questions to lock it in.`});
    }
  });
  items.push({action:'advance',order:3,title:'Lecture 4: Linear regression',course:'Introduction to Machine Learning',minutes:60,lesson:null,
    reason:'You are on track in this course. Keep the momentum with the next lecture.'});
  items.sort((a,b)=>a.order-b.order||(a.m||1)-(b.m||1));
  const budget=S.hours*60;let used=0;
  items.forEach(it=>{if(used+it.minutes<=budget){it.fit=true;used+=it.minutes}else it.fit=false});
  return{items,fit:items.filter(i=>i.fit),later:items.filter(i=>!i.fit),used,budget};
}

function shapeSVG(state,size=16){

  const s={done:'<circle cx="8" cy="8" r="6"/>',revisit:'<path d="M8 1.5 14.5 8 8 14.5 1.5 8z"/>',practise:'<rect x="2.5" y="2.5" width="11" height="11" rx="2"/>',current:'<circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="2.4"/>',upcoming:'<circle cx="8" cy="8" r="3.5"/>'}[state];

}
const legendHTML=()=>`<ul class="legend" aria-label="What the shapes mean">${['done','revisit','practise','current','upcoming'].map(s=>`<li>${shapeSVG(s)}${STATE_LABEL[s]}</li>`).join('')}</ul>`;

function fallbackSVG(nodes){

  return `<svg class="fallback" viewBox="0 0 ${W} ${H}" role="presentation" aria-hidden="true"><polyline points="${path}" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>${nodes.map((nd,i)=>{const p=pt(i);return `<ellipse cx="${p[0]}" cy="${p[1]}" rx="17" ry="8" fill="${col[nd.state]}"/>`}).join('')}</svg>`;

/* ---------- forms ---------- */
const V={
  name:v=>v.trim().length<2?'Enter your full name, at least 2 characters.':'',
  email:v=>!v.trim()?'Enter your email address.':(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?'Enter a valid email such as name@college.edu.':''),
  phone:v=>!/^\d{10}$/.test(v.replace(/\s/g,''))?'Enter a 10-digit phone number.':'',
  dept:v=>!v?'Choose your department.':'',
  password:v=>v.length<8?'Use at least 8 characters.':(!/[A-Za-z]/.test(v)||!/\d/.test(v)?'Include at least one letter and one number.':''),
  loginpw:v=>!v?'Enter your password.':(v.length<8?'Passwords have at least 8 characters.':''),
  confirm:(v,f)=>v!==f.elements.password.value?'Passwords do not match.':''
};
function field(o){
  const ids=[o.hint?o.name+'-hint':'',o.name+'-msg'].filter(Boolean).join(' ');
  let input;
  if(o.type==='select')input=`<select id="${o.name}" name="${o.name}" aria-describedby="${ids}">${o.options}</select>`;
  else if(o.type==='password')input=`<div class="pw"><input id="${o.name}" name="${o.name}" type="password" autocomplete="${o.ac||'off'}" aria-describedby="${ids}"><button type="button" class="reveal" aria-pressed="false" aria-label="Show password">Show</button></div>`;
  else input=`<input id="${o.name}" name="${o.name}" type="${o.type||'text'}" autocomplete="${o.ac||'off'}" ${o.mode?`inputmode="${o.mode}"`:''} aria-describedby="${ids}">`;
  return `<div class="field"><label for="${o.name}">${o.label}</label>${input}${o.hint?`<p class="hint" id="${o.name}-hint">${o.hint}</p>`:''}<p class="msg" id="${o.name}-msg"></p></div>`;
}
function setFieldState(inp,msg){
  const f=inp.closest('.field'),m=$('.msg',f);
  f.classList.toggle('invalid',!!msg);f.classList.toggle('valid',!msg&&inp.value!=='');
  inp.setAttribute('aria-invalid',msg?'true':'false');
  m.innerHTML=msg?`${ic('alert')}<span>${esc(msg)}</span>`:(inp.value?`${ic('check')}<span>Looks good</span>`:'');
}
function bindForm(form,rules,onOk){
  const check=name=>{const inp=form.elements[name];const msg=rules[name](inp.value,form);setFieldState(inp,msg);return !msg};
  Object.keys(rules).forEach(name=>{
    const inp=form.elements[name];
    inp.addEventListener('blur',()=>{inp.dataset.touched='1';check(name)});
    inp.addEventListener('input',()=>{if(inp.dataset.touched)check(name);if(name==='password'&&form.elements.confirm&&form.elements.confirm.dataset.touched)check('confirm')});
    inp.addEventListener('change',()=>{inp.dataset.touched='1';check(name)});
  });
  $$('.reveal',form).forEach(b=>b.addEventListener('click',()=>{
    const inp=b.previousElementSibling,show=inp.type==='password';inp.type=show?'text':'password';
    b.textContent=show?'Hide':'Show';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',show?'Hide password':'Show password');
  }));
  form.addEventListener('submit',e=>{
    e.preventDefault();let first=null;
    Object.keys(rules).forEach(name=>{const ok=check(name);if(!ok&&!first)first=form.elements[name]});

  });
}

      </div>
      <div role="tabpanel" id="panel-list" aria-labelledby="tab-list" hidden>
        <ul class="lesson-list">${LESSONS.map(x=>{const w=S.watched[x.id]||0;return `<li><a href="#/learn/${x.id}" ${x.id===l.id?'aria-current="page"':''}><span>${w>=.9?ic('check'):ic('play')}</span><span>${x.n}. ${esc(x.title)}</span><small>${w>=.9?'Done':w>0?pct(w)+'%':fmt(x.dur)}</small></a></li>`}).join('')}</ul>
      </div>
    </div>
  </div></div>`;

  function mount(root){
    /* player */
    let playing=false,speed=1,timer=0,sinceSave=0;const speeds=[1,2,4];
    const scrub=$('#scrub',root),play=$('#playBtn',root);
    const paint=()=>{$('#tNow',root).textContent=fmt(t);scrub.value=t;$('#askAt',root).textContent=`Your question will include the current time, ${fmt(t)}.`};
    const save=()=>{S.watched[l.id]=Math.max(S.watched[l.id]||0,t/l.dur);$('#saveNote',root).innerHTML=`${ic('check')}<span>Saved at ${fmt(t)}. ${pct(S.watched[l.id])}% of this lecture watched.</span>`};
    const setPlay=on=>{playing=on;play.innerHTML=ic(on?'pause':'play');play.setAttribute('aria-label',on?'Pause':'Play');clearInterval(timer);if(on)timer=setInterval(()=>{t=Math.min(l.dur,t+.25*speed);sinceSave+=.25;paint();if(sinceSave>=10){sinceSave=0;save()}if(t>=l.dur){setPlay(false);save();toast('Lecture finished. Take the quiz to update your plan.','check')}},250);else save()};
    play.addEventListener('click',()=>setPlay(!playing));
    scrub.addEventListener('input',()=>{t=+scrub.value;paint()});
    $('#speedBtn',root).addEventListener('click',e=>{speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];e.currentTarget.textContent=speed+'x';e.currentTarget.setAttribute('aria-label',`Playback speed ${speed} times`)});
    disposers.push(()=>{clearInterval(timer)});
    const seek=s=>{t=clamp(s,0,l.dur);paint();save()};

    /* tabs */
    const tabs=$$('[role=tab]',root);
    const show=tab=>tabs.forEach(b=>{const on=b===tab;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;$('#'+b.getAttribute('aria-controls'),root).hidden=!on});
    tabs.forEach((b,i)=>{b.addEventListener('click',()=>show(b));b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];show(n);n.focus()}})});

    /* tutor */
    const log=$('#tutorLog',root);
    const bubble=(cls,html)=>{const d=document.createElement('div');d.className='bubble '+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d};
    let busy=false;
    function ask(text){
      text=text.trim();if(!text||busy)return;busy=true;log.setAttribute('aria-busy','true');
      bubble('me',esc(text)+`<div class="fine" style="opacity:.85">at ${fmt(t)}</div>`);
      const hit=TUTOR_KB.find(k=>k.re.test(text));
      const b=bubble('bot','<span class="typing" aria-label="Tutor is typing"><i></i><i></i><i></i></span>');
      const wait=setTimeout(()=>{
        const ans=hit?hit.a:'That is not in this course\'s material, so I will not guess. Try asking about normalization, joins, indexing or transactions, or ask your instructor.';
        const finish=()=>{
          b.innerHTML=esc(ans)+(hit?`<div class="cites">${hit.c.map(c=>`<button class="chip cite" data-seek="${c[1]}" data-lec="${c[0]}">${ic('clock')}Lecture ${c[0]} at ${fmt(c[1])}</button>`).join('')}</div>`:'<div class="cites"><span class="chip cite">No matching source</span></div>');
          busy=false;log.setAttribute('aria-busy','false');log.scrollTop=log.scrollHeight;
        };
        if(reduce){finish();return}
        const words=ans.split(' ');let i=0;b.textContent='';
        const iv=setInterval(()=>{i++;b.textContent=words.slice(0,i).join(' ');log.scrollTop=log.scrollHeight;if(i>=words.length){clearInterval(iv);finish()}},42);
        disposers.push(()=>clearInterval(iv));
      },reduce?0:700);
      disposers.push(()=>clearTimeout(wait));
    }
    $('#askForm',root).addEventListener('submit',e=>{e.preventDefault();const i=$('#askInput',root);const v=i.value;i.value='';ask(v)});
    $('#suggest',root).addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b)ask(b.dataset.q)});
    log.addEventListener('click',e=>{const b=e.target.closest('[data-seek]');if(!b)return;if(+b.dataset.lec===l.n){seek(+b.dataset.seek);toast(`Jumped to ${fmt(+b.dataset.seek)}.`,'clock')}else{location.hash='#/learn/dbms-'+b.dataset.lec}});

    /* class chat */
    const cl=$('#classLog',root);let ri=0;
    $('#classForm',root).addEventListener('submit',e=>{
      e.preventDefault();const i=$('#classInput',root),v=i.value.trim();if(!v)return;i.value='';
      const me=document.createElement('div');me.className='bubble me';me.textContent=v;cl.appendChild(me);cl.scrollTop=cl.scrollHeight;
      const r=CLASS_REPLIES[ri++%CLASS_REPLIES.length];
      const to=setTimeout(()=>{const p=document.createElement('div');p.className='bubble peer';p.innerHTML=`<span class="who">${r[0]}</span>${esc(r[1])}`;cl.appendChild(p);cl.scrollTop=cl.scrollHeight},reduce?0:1100);
      disposers.push(()=>clearTimeout(to));
    });

    /* quiz with flip */
    const flip=$('#flip',root),front=$('#qFront',root),back=$('#qBack',root);
    let qi=0,score=0;
    function drawQ(){
      const q=QUIZ[qi];
      front.innerHTML=`<div class="row between"><span class="badge b-advance">Quiz: ${esc(l.topic)}</span><span class="muted fine">Question ${qi+1} of ${QUIZ.length}</span></div>
        <h3 style="margin:.8rem 0 0">${esc(q.q)}</h3>
        <form id="qForm"><fieldset style="border:0;padding:0;margin:0"><legend class="sr">Choose one answer</legend><div class="opts">${q.o.map((o,i)=>`<label class="opt"><input type="radio" name="ans" value="${i}"> ${esc(o)}</label>`).join('')}</div></fieldset>
        <button class="btn primary" type="submit" id="checkBtn" disabled>Check answer</button></form>`;
      const form=$('#qForm',front);
      form.addEventListener('change',()=>{$('#checkBtn',front).disabled=false});
      form.addEventListener('submit',e=>{
        e.preventDefault();const v=form.elements.ans.value;if(v==='')return;const ok=+v===q.a;if(ok)score++;
        back.innerHTML=`<div class="verdict ${ok?'ok':'no'}">${ic(ok?'check':'alert')}${ok?'Correct':'Not quite'}</div>
          <p style="margin:.6rem 0">${esc(q.exp)}</p>
          ${ok?'':`<button class="chip cite" type="button" data-seek="${q.c}">${ic('refresh')}Rewatch ${fmt(q.c)}</button>`}
          <div style="margin-top:1rem"><button class="btn primary" type="button" id="nextBtn">${qi===QUIZ.length-1?'See results':'Next question'}</button></div>`;
        back.setAttribute('aria-hidden','false');front.setAttribute('aria-hidden','true');flip.classList.add('flipped');
        setTimeout(()=>{const n=$('#nextBtn',back);if(n)n.focus()},reduce?0:650);
        $('#nextBtn',back).addEventListener('click',()=>{
          if(qi===QUIZ.length-1){finishQuiz();return}
          qi++;flip.classList.remove('flipped');back.setAttribute('aria-hidden','true');front.setAttribute('aria-hidden','false');
          const to=setTimeout(()=>{drawQ();const r=$('input[type=radio]',front);if(r)r.focus()},reduce?0:350);disposers.push(()=>clearTimeout(to));
        });
        const sk=$('[data-seek]',back);if(sk)sk.addEventListener('click',()=>{seek(+sk.dataset.seek);toast(`Jumped to ${fmt(+sk.dataset.seek)}.`,'clock')});
      });
    }
    function finishQuiz(){
      const qv=score/QUIZ.length,w=Math.min(1,S.watched[l.id]||0),retry=Math.min(.2,.05*S.quizTries);S.quizTries++;
      const raw=clamp(.6*qv+.3*w-retry,0,1),prev=S.mastery[l.topic],next=.7*raw+.3*prev;S.mastery[l.topic]=next;
      flip.classList.remove('flipped');back.setAttribute('aria-hidden','true');front.setAttribute('aria-hidden','false');
      const [lab,cls]=masteryLabel(next);
      front.innerHTML=`<div class="verdict ok">${ic('sparkles')}Quiz complete: ${score} of ${QUIZ.length}</div>
        <p style="margin:.6rem 0">Your ${esc(l.topic)} mastery moved from <strong>${pct(prev)}%</strong> to <strong>${pct(next)}%</strong> <span class="badge ${cls}">${lab}</span></p>
        <p class="muted">The planner has re-sorted your week using the new score.</p>
        <div class="row"><a class="btn primary" href="#/plan">${ic('target')}See updated plan</a><button class="btn ghost" id="retry">Retake quiz</button></div>`;
      $('#topicBadge',root).className='badge '+cls;$('#topicBadge',root).textContent=`${l.topic}: ${pct(next)}% mastery`;
      $('#retry',front).addEventListener('click',()=>{qi=0;score=0;drawQ()});
      notify(`Your study plan was updated after the ${l.topic} quiz.`,'plan');toast(`${l.topic} mastery is now ${pct(next)}%. Plan updated.`,'target');
    }
    drawQ();
  }
  return{title:`Lecture ${l.n}: ${l.title} | AdaptLearn`,html,mount,cleanup(){disposers.forEach(f=>f());disposers.length=0}};
}

function pagePlan(){
  let plan=buildPlan(),hl=-1;
  const html=`<div class="container">
    <div class="page-head"><h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">Your study plan</h1><p>Built from your quiz scores and watch time. Pick a stop on the path to see why it is there.</p></div>
    <div class="plan-grid">
      <div class="stack">
        <div class="stage sm" id="planStage" role="img" aria-label="3D path of this week's plan. The same stops are listed below."></div>
        ${legendHTML()}
        <div class="card"><div class="slider"><label for="hours"><strong>Study time this week</strong></label><input type="range" id="hours" min="1" max="8" step="1" value="${S.hours}" aria-describedby="hoursOut"><output id="hoursOut" style="font-weight:800;min-width:4.5ch">${S.hours} h</output></div>
          <p class="fine muted" style="margin:.4rem 0 0" id="usedNote"></p></div>
        <div><h2 style="font-size:1.35rem">This week</h2><ol class="plan-list" id="planList"></ol>
        <h2 style="font-size:1.15rem;margin-top:1.4rem" id="laterHead">Does not fit this week</h2><ol class="plan-list" id="laterList"></ol>
        <p class="fine muted" style="margin-top:.8rem">The order and hours come from fixed rules. The wording of each reason is written by the AI planner (sample text here).</p></div>
      </div>
      <div class="stack"><div class="card"><h2 style="font-size:1.3rem">Topic mastery</h2><div id="mastery"></div>
        <p class="fine muted" style="margin:0">Below 60% is weak, 60 to 80% is close, above 80% is strong.</p></div>
        <div class="card"><h2 style="font-size:1.15rem">Want a better score?</h2><p class="muted">Take the Normalization quiz and watch the plan re-sort.</p><a class="btn sun small" href="#/learn/dbms-4">${ic('play')}Open Lecture 4</a></div></div>
    </div></div>`;
  function nodesOf(){return[...plan.fit.map(i=>({title:i.title,state:ACTION_STATE[i.action],detail:i.minutes+' min'})),...plan.later.map(i=>({title:i.title,state:'upcoming',detail:i.minutes+' min, next week'}))]}
  function drawLists(root){
    const item=(it,idx,later)=>{const st=later?'upcoming':ACTION_STATE[it.action];
      return `<li><button class="plan-item ${later?'later':''} ${hl===idx?'hl':''}" data-i="${idx}" aria-label="${ACTION_LABEL[it.action]}: ${esc(it.title)}, ${it.minutes} minutes"><span class="shape">${shapeSVG(st,22)}</span>
      <strong>${esc(it.title)} <span class="badge b-${later?'later':it.action}">${later?'Next week':ACTION_LABEL[it.action]}</span></strong>
      <p>${esc(it.reason)} <span class="muted">(${it.minutes} min, ${esc(it.course)})</span></p></button></li>`};
    $('#planList',root).innerHTML=plan.fit.map((it,i)=>item(it,i,false)).join('')||'<li class="muted">Nothing fits. Add more hours above.</li>';
    $('#laterList',root).innerHTML=plan.later.map((it,i)=>item(it,plan.fit.length+i,true)).join('');
    $('#laterHead',root).hidden=!plan.later.length;
    $('#usedNote',root).textContent=`${plan.used} of ${plan.budget} minutes planned.`;
    $('#mastery',root).innerHTML=Object.entries(S.mastery).sort((a,b)=>a[1]-b[1]).map(([k,v])=>{const [lab,cls]=masteryLabel(v);return `<div class="mastery-row"><span>${esc(k)} <span class="badge ${cls}">${lab}</span></span><span>${pct(v)}%</span>${barHTML(v,['coral','sun','mint'][band(v)])}</div>`}).join('');
  }
  return{title:'Study plan | AdaptLearn',html,mount(root){
    drawLists(root);
    const select=i=>{hl=i;$$('.plan-item',root).forEach(b=>b.classList.toggle('hl',+b.dataset.i===i));const el=$(`.plan-item[data-i="${i}"]`,root);if(el)el.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'})};
    mountStage($('#planStage',root),nodesOf(),{onSelect:select});
    root.addEventListener('click',e=>{const b=e.target.closest('.plan-item');if(!b)return;const i=+b.dataset.i;hl=i;$$('.plan-item',root).forEach(x=>x.classList.toggle('hl',+x.dataset.i===i));if(sceneApi)sceneApi.hopTo(i)});
    $('#hours',root).addEventListener('input',e=>{
      S.hours=+e.target.value;$('#hoursOut',root).textContent=S.hours+' h';plan=buildPlan();hl=-1;drawLists(root);
      if(sceneApi)sceneApi.setNodes(nodesOf());else $('#planStage',root).innerHTML=fallbackSVG(nodesOf());
    });
  },cleanup(){unmountStage()}};
}

function pageAdmin(){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],vals=[12,18,9,22,17,26,20],mx=Math.max(...vals);
  const chart=`<svg class="chart" viewBox="0 0 420 190" role="img" aria-label="New enrollments this week: ${days.map((d,i)=>d+' '+vals[i]).join(', ')}" style="width:100%;height:auto">
    <line x1="10" y1="160" x2="410" y2="160" stroke="var(--line)" stroke-width="2"/>
    ${vals.map((v,i)=>{const h=v/mx*118,x=24+i*56;return `<rect x="${x}" y="${160-h}" width="34" height="${h}" rx="9"/><text class="val" x="${x+17}" y="${152-h}" text-anchor="middle">${v}</text><text x="${x+17}" y="180" text-anchor="middle">${days[i]}</text>`}).join('')}</svg>`;
  const html=`<div class="container">
    <div class="page-head"><h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">Admin overview</h1><p>Sample numbers for the demo.</p></div>
    <dl class="stats" style="margin-bottom:1.25rem">
      <div class="stat"><dt>Total students</dt><dd>1,284</dd></div><div class="stat"><dt>Active enrollments</dt><dd>3,910</dd></div>
      <div class="stat"><dt>Average completion</dt><dd>58%</dd></div><div class="stat"><dt>At-risk students</dt><dd>${AT_RISK.length}</dd></div>
    </dl>
    <div class="admin-grid">
      <div class="card"><h2 style="font-size:1.3rem">New enrollments this week</h2>${chart}</div>
      <div class="card"><h2 style="font-size:1.3rem">Course Studio</h2><p class="muted">Paste an NPTEL playlist link. The studio drafts modules, topics and quizzes for you to review.</p>
        <form id="importForm" novalidate>${field({name:'url',label:'Playlist URL',type:'url',hint:'Example: https://www.youtube.com/playlist?list=...'})}
        <button class="btn primary" type="submit" id="importBtn">${ic('link')}Import playlist</button></form>
        <ol class="import-steps" id="steps" aria-live="polite"></ol><div id="draft"></div></div>
    </div>
    <div class="card" style="margin-top:1.25rem"><div class="row between" style="margin-bottom:.8rem"><h2 style="font-size:1.3rem;margin:0">Students who may need help</h2><span class="muted fine">Mastery below 50% or inactive for 5 or more days</span></div>
      <div class="table-wrap"><table><thead><tr><th scope="col">Student</th><th scope="col">Course</th><th scope="col">Mastery</th><th scope="col">Last active</th><th scope="col"><span class="sr">Action</span></th></tr></thead>
      <tbody>${AT_RISK.map((s,i)=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.course)}</td><td><span class="badge b-revisit">${pct(s.m)}% Weak</span></td><td>${esc(s.last)}</td><td><button class="btn ghost small" data-nudge="${i}">${ic('bell')}Send nudge</button></td></tr>`).join('')}</tbody></table></div></div></div>`;
  const disposers=[];
  return{title:'Admin | AdaptLearn',html,mount(root){
    root.addEventListener('click',e=>{const b=e.target.closest('[data-nudge]');if(!b)return;const s=AT_RISK[+b.dataset.nudge];b.disabled=true;b.innerHTML=`${ic('check')}Nudge sent`;toast(`Nudge sent to ${s.name}.`,'bell')});
    const form=$('#importForm',root);
    const rule=v=>!v.trim()?'Paste a playlist link.':(/^https?:\/\/(www\.)?(youtube\.com\/playlist\?list=|youtu\.be\/)[\w-]+/i.test(v.trim())?'':'That does not look like a YouTube playlist link.');
    const STEPS=['Fetching playlist details','Grouping videos into modules','Tagging topics','Indexing transcripts','Drafting quizzes'];
    bindForm(form,{url:rule},()=>{
      const btn=$('#importBtn',root),list=$('#steps',root),draft=$('#draft',root);btn.disabled=true;draft.innerHTML='';
      list.innerHTML=STEPS.map(s=>`<li>${ic('clock')}<span>${s}</span></li>`).join('');
      let i=0;const lis=$$('li',list);
      const tick=()=>{
        if(i>0){lis[i-1].className='done';lis[i-1].firstElementChild.outerHTML=ic('check')}
        if(i>=STEPS.length){
          btn.disabled=false;
          draft.innerHTML=`<div class="card" style="margin-top:1rem;background:var(--surface-2);box-shadow:none"><strong>Draft ready</strong><p class="muted" style="margin:.2rem 0 .8rem">5 modules, 32 lectures, 14 topics and 32 quizzes are waiting for review.</p>
          <div class="table-wrap"><table style="min-width:420px"><thead><tr><th scope="col">Quiz draft</th><th scope="col"><span class="sr">Action</span></th></tr></thead><tbody>${['Lecture 1: ER model, 5 questions','Lecture 2: Relational algebra, 5 questions','Lecture 3: SQL and joins, 6 questions'].map((q,k)=>`<tr><td>${q}</td><td><button class="btn ghost small" data-approve="${k}">Approve</button></td></tr>`).join('')}</tbody></table></div></div>`;
          $$('[data-approve]',draft).forEach(a=>a.addEventListener('click',()=>{a.disabled=true;a.innerHTML=`${ic('check')}Approved`}));
          toast('Playlist imported as a draft course.','check');return;
        }
        lis[i].className='run';i++;const to=setTimeout(tick,reduce?0:800);disposers.push(()=>clearTimeout(to));
      };tick();
    });
  },cleanup(){disposers.forEach(f=>f())}};
}
function pageNotFound(){return{title:'Not found | AdaptLearn',html:`<div class="container empty" style="padding-top:4rem">${mascotSVG(96)}<h1 style="font-size:2rem">That page is not here</h1><p>Check the address or go back to the start.</p><a class="btn primary" href="#/">Back to home</a></div>`}}

/* ---------- router ---------- */
const ROUTES=[
  {p:/^\/$/,f:pageHome},{p:/^\/login$/,f:pageLogin},{p:/^\/register$/,f:pageRegister},
  {p:/^\/dashboard$/,f:pageDash,auth:true,role:'student'},{p:/^\/courses$/,f:pageCourses},
  {p:/^\/learn\/([\w-]+)$/,f:pageLesson,auth:true,role:'student'},{p:/^\/plan$/,f:pagePlan,auth:true,role:'student'},
  {p:/^\/admin$/,f:pageAdmin,auth:true,role:'admin'}
];
let active=null;
function route(){
  if(active&&active.cleanup)active.cleanup();active=null;
  const path=currentPath();let page=null;
  for(const r of ROUTES){
    const m=path.match(r.p);if(!m)continue;
    if(r.auth&&!S.user){toast('Log in to open that page.','alert');location.hash='#/login';return}
    if(r.role&&S.user&&S.user.role!==r.role){toast(r.role==='admin'?'That page is for admins.':'Admins have their own overview.','alert');location.hash=S.user.role==='admin'?'#/admin':'#/dashboard';return}
    page=r.f(m[1]);break;
  }
  if(!page)page=pageNotFound();
  const view=$('#view');view.innerHTML=page.html;document.title=page.title;
  active=page;renderNav();closeMenu();
  window.scrollTo(0,0);
  $('#main').focus({preventScroll:true});
  if(page.mount)page.mount(view);
}
window.addEventListener('hashchange',route);

/* ---------- init ---------- */
(function init(){
  const th=store.get('al_theme');if(th)document.documentElement.dataset.theme=th;
  $('#brandMark').innerHTML=mascotSVG(38);
  if(S.user&&S.user.role!=='admin')startLive();
  route();
})();
})();
</script>
