services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adaptlearn
      POSTGRES_USER: adaptlearn
      POSTGRES_PASSWORD: adaptlearn
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ai-service:
    build: ./ai-service
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  postgres-data:
